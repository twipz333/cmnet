name: One-time merged branch cleanup

# Runs only when this workflow first arrives in master. Remove the workflow
# after success; no permanent maintenance CI is needed.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prune only reviewed, redundant branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" > /tmp/cmnet-pulls.json
          git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin |
            while read -r remote sha; do
              branch="${remote#origin/}"
              [[ "$branch" == "HEAD" || "$branch" == "master" ]] && continue

              # Never remove the branch of an unfinished PR.
              if jq -e --arg b "$branch" \
                'any(.[]; .state == "open" and .head.ref == $b)' \
                /tmp/cmnet-pulls.json >/dev/null; then
                echo "KEEP open PR: $branch"
                continue
              fi

              # A branch is redundant if its head is an ancestor of master,
              # or if its exact head belongs to an already merged PR.
              redundant=false
              if git merge-base --is-ancestor "$sha" origin/master; then
                redundant=true
              elif jq -e --arg b "$branch" --arg sha "$sha" \
                'any(.[]; .merged_at != null and .head.ref == $b and .head.sha == $sha)' \
                /tmp/cmnet-pulls.json >/dev/null; then
                redundant=true
              fi

              # PR #9 was explicitly superseded by merged PR #10. Keep its
              # unique original commit reachable without an active branch.
              if [[ "$branch" == "fix/scout-speed-profiles" && "$redundant" == false ]]; then
                archive="archive/superseded-scout-profiles-pr9"
                if ! git ls-remote --exit-code --tags origin "refs/tags/$archive" >/dev/null; then
                  git tag "$archive" "$sha"
                  git push origin "refs/tags/$archive"
                fi
                redundant=true
              fi

              if [[ "$redundant" == true ]]; then
                echo "DELETE redundant branch: $branch ($sha)"
                # Lease prevents racing with work pushed since the fetch.
                git push --force-with-lease="refs/heads/$branch:$sha" \
                  origin ":refs/heads/$branch"
              else
                echo "KEEP unique or unreviewed branch: $branch ($sha)"
              fi
            done
