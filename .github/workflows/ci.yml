name: CI

on:
  push:
  pull_request:

jobs:
  # Build + test on each OS. Determinism is verified in the cross-platform job below.
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log
      - name: surface test failures as annotations
        if: failure()
        shell: bash
        # Job logs are not always reachable; annotations are. Each failing test
        # becomes one annotation carrying its output.
        run: |
          awk '/^--- FAIL/{if(b!="")print b; b=$0; n=0; next}
               b!="" && n<25 {b=b"%0A"$0; n++}
               /^(FAIL|ok)[ \t]/{if(b!=""){print b; b=""}}
               END{if(b!="")print b}' test.log | head -10 | sed 's/^/::error title=go test::/'
          grep -E "^(FAIL|# |.*\.go:[0-9]+:[0-9]+:)" test.log | head -20 | sed 's/^/::error title=build::/' || true

  # Hard gate: the runtime binary must build fully static (no CGO) for Windows.
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: static windows build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -o advisor.exe ./cmd/advisor

  # Cross-platform determinism (§6/§12): the same bundle + same input must produce a
  # byte-identical ranking on Windows and Linux. Both OSes run the golden test
  # against the same committed golden file, so any platform float drift fails here.
  determinism:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: cross-platform golden ranking
        run: go test -run TestGoldenRankingByteIdentical -count=1 ./internal/determinism/
