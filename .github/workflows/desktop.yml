name: desktop

# Builds the Windows installer: the Go core as a static advisor.exe, wrapped in
# the Electron shell, packaged by electron-builder as an NSIS installer that lets
# the user choose the install folder.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: build core (static, no CGO)
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p desktop/resources
          go build -trimpath -ldflags "-s -w" -o desktop/resources/advisor.exe ./cmd/advisor
      - name: install shell deps
        working-directory: desktop
        run: npm ci
      - name: build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cmnet-setup
          path: desktop/dist/*.exe
          if-no-files-found: error
