name: desktop

# Builds the Windows installer: the Go core as a static advisor.exe, wrapped in
# the Electron shell, packaged by electron-builder as an NSIS installer that lets
# the user choose the install folder.
#
# Releases: pushing a tag vX.Y.Z builds the installer with that version and
# publishes it (with latest.yml) to GitHub Releases. Installed apps check there
# and update themselves. Other runs only upload the installer as an artifact.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'internal/web/static/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: check desktop and renderer JavaScript syntax
        shell: bash
        run: |
          for f in desktop/{main,preload,welcome,datadirs}.js internal/web/static/ui/*.js; do
            node --check "$f"
          done
      - name: build core (static, no CGO)
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p desktop/resources
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o desktop/resources/advisor.exe ./cmd/advisor
      - name: install shell deps
        working-directory: desktop
        run: npm ci
      - name: version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --publish never
      # Never let the host and guest builders publish independently. Doing so
      # created TWO GitHub releases for v0.3.3, splitting latest.yml/guest.yml
      # and causing 404 errors in electron-updater despite a green Actions run.
      - name: build both release editions without publishing
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --publish never
          npx electron-builder --win nsis --publish never --config electron-builder.guest.js
      - name: publish exactly one complete GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(
            "desktop/dist/cmnet-setup-${GITHUB_REF_NAME#v}.exe"
            "desktop/dist/cmnet-setup-${GITHUB_REF_NAME#v}.exe.blockmap"
            "desktop/dist/latest.yml"
            "desktop/dist-guest/cmnet-guest-setup-${GITHUB_REF_NAME#v}.exe"
            "desktop/dist-guest/cmnet-guest-setup-${GITHUB_REF_NAME#v}.exe.blockmap"
            "desktop/dist-guest/guest.yml"
          )
          for f in "${files[@]}"; do
            if [[ ! -s "$f" ]]; then echo "::error::Release file is missing or empty: $f"; exit 1; fi
          done
          # gh creates/uploads all six files to the same release ID. A re-run
          # is idempotent: upload into the existing release rather than create
          # a second one with the same tag.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes "cmnet Windows release" --latest
          fi
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets | map(.name) | sort | join(", ")'
      - uses: actions/upload-artifact@v4
        with:
          name: cmnet-setup
          path: desktop/dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cmnet-guest-setup
          path: desktop/dist-guest/*.exe
          if-no-files-found: error
