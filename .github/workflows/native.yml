name: native-windows

# Experimental WPF frontend: no Chromium, HTML or WebView.
# Until native parity is complete it is a separate artifact, not an
# automatic replacement of the production Electron installer.
on:
  push:
    branches: [master]
    paths:
      - 'native/**'
      - 'native/installer/**'
      - 'internal/web/**'
      - 'internal/session/**'
      - 'internal/cache/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'native/installer/**'
      - 'internal/web/**'
      - 'internal/session/**'
      - 'internal/cache/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Go core for native Windows client
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p native/out
          NATIVE_VER="${NATIVE_VERSION:-0.4.0-native}"
          go build -trimpath -ldflags "-s -w -X main.version=${NATIVE_VER}" -o native/out/advisor.exe ./cmd/advisor
          printf '%s\n' "${NATIVE_VER}" > native/out/advisor.version
      - name: Compile and publish WPF app (self-contained, no browser)
        shell: pwsh
        run: |
          $nativeVer = if ($env:NATIVE_VERSION) { $env:NATIVE_VERSION } else { '0.4.0-native' }
          dotnet publish native/Cmnet.Native.csproj -c Release -r win-x64 --self-contained true -o native/out `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:Version=0.4.0 -p:InformationalVersion=$nativeVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path native/out/Cmnet.Native.exe)) { throw 'Missing WPF executable' }
          if (-not (Test-Path native/out/advisor.exe)) { throw 'Missing Go sidecar' }
          if (-not (Test-Path native/out/advisor.version)) { Set-Content -Path native/out/advisor.version -Value $nativeVer }
      - name: Smoke-test WPF view navigation on Windows
        shell: pwsh
        run: |
          $binary = (Resolve-Path native/out/Cmnet.Native.exe).Path
          $process = Start-Process -FilePath $binary -ArgumentList '--smoke-ui' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'WPF navigation smoke timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "WPF navigation smoke failed: exit $($process.ExitCode)"
          }
      - name: Capture native WPF screenshots for visual review
        shell: pwsh
        run: |
          # WinExe is a GUI subsystem application. Direct PowerShell '&'
          # launches it without waiting, causing a screenshot/upload race.
          $exe = (Resolve-Path native/out/Cmnet.Native.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--capture-ui', 'native/ui-snapshots') -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw 'WPF visual capture timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "WPF visual capture failed: exit $($process.ExitCode)"
          }
          $matrix = Get-Content native/ui-snapshots/geometry.json -Raw | ConvertFrom-Json
          if ($matrix.Count -ne 33) { throw 'Incomplete WPF screenshot matrix' }
          foreach ($file in @('scout.png', 'draft.png') + @($matrix.file)) {
            $candidate = Get-Item "native/ui-snapshots/$file" -ErrorAction Stop
            if ($candidate.PSIsContainer -or $candidate.Length -lt 2048) {
              throw "Invalid screenshot $file"
            }
            Write-Host "$($candidate.Name) $($candidate.Length) bytes attributes=$($candidate.Attributes)"
          }
          Get-ChildItem native/ui-snapshots -Force | Format-Table Name, Length, Attributes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmnet-wpf-3b-screenshots
          path: native/ui-snapshots/
          include-hidden-files: true
          if-no-files-found: error
      - name: Zip native preview with Go sidecar
        shell: pwsh
        run: Compress-Archive -Path native/out/* -DestinationPath native/cmnet-native-preview-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cmnet-native-preview-win-x64
          path: native/cmnet-native-preview-win-x64.zip
          if-no-files-found: error
      # Gate 3.2 friend package (NSIS + portable zip). Does NOT publish to GitHub
      # Releases and does NOT touch desktop.yml / Electron cmnet-setup-*.exe.
      - name: Build native NSIS installer + portable package
        shell: pwsh
        run: |
          # Prefer system/winget NSIS so CI produces setup EXE (not zip-only).
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            winget install --id NSIS.NSIS -e --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
          pwsh -File native/installer/Build-NativeInstaller.ps1 -SkipPublish -SkipSmoke
          if (-not (Test-Path native/dist/cmnet-native-0.4.0-win-x64.zip)) {
            throw 'Missing native portable zip'
          }
          if (-not (Test-Path native/dist/cmnet-native-setup-0.4.0.exe)) {
            throw 'Missing NSIS setup EXE (Gate 3.2 requires cmnet-native-setup-0.4.0.exe)'
          }
          Get-ChildItem native/dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: cmnet-native-setup
          path: |
            native/dist/cmnet-native-setup-0.4.0.exe
            native/dist/cmnet-native-0.4.0-win-x64.zip
            native/dist/cmnet-native-package.manifest.json
          if-no-files-found: error
