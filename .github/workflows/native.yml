name: native-windows

# Experimental WPF frontend: no Chromium, HTML or WebView.
# Until native parity is complete it is a separate artifact, not an
# automatic replacement of the production Electron installer.
on:
  push:
    branches: [master]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Go core for native Windows client
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p native/out
          go build -trimpath -ldflags "-s -w" -o native/out/advisor.exe ./cmd/advisor
      - name: Compile and publish WPF app (self-contained, no browser)
        shell: pwsh
        run: |
          dotnet publish native/Cmnet.Native.csproj -c Release -r win-x64 --self-contained true -o native/out -p:PublishSingleFile=true -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path native/out/Cmnet.Native.exe)) { throw 'Missing WPF executable' }
          if (-not (Test-Path native/out/advisor.exe)) { throw 'Missing Go sidecar' }
      - name: Smoke-test WPF view navigation on Windows
        shell: pwsh
        run: |
          $binary = (Resolve-Path native/out/Cmnet.Native.exe).Path
          $process = Start-Process -FilePath $binary -ArgumentList '--smoke-ui' -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'WPF navigation smoke timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "WPF navigation smoke failed: exit $($process.ExitCode)"
          }
      - name: Zip native preview with Go sidecar
        shell: pwsh
        run: Compress-Archive -Path native/out/* -DestinationPath native/cmnet-native-preview-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cmnet-native-preview-win-x64
          path: native/cmnet-native-preview-win-x64.zip
          if-no-files-found: error
