<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cmnet</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">cmnet</div>

    <div class="seat" id="seat">
      <span class="seat-label">Мы за</span>
      <div class="switch" role="group" aria-label="Наша сторона">
        <button type="button" data-side="radiant" class="side-btn radiant">Radiant</button>
        <button type="button" data-side="dire" class="side-btn dire">Dire</button>
      </div>
      <button type="button" class="link-btn" id="first-pick" title="Кто выбирает первым. Смена очищает доску."></button>
    </div>

    <div class="source" id="source"></div>

    <div class="strength" id="strength" hidden>
      <div class="strength-num" id="strength-num"></div>
      <div class="strength-track"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="strength-cap">шанс на победу по драфту</div>
    </div>

    <div class="bar-end">
      <span class="auto" id="auto"></span>
      <button type="button" class="icon-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Меню">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <nav class="menu" id="menu" hidden>
        <button type="button" data-cmd="new">Новый драфт</button>
        <hr>
        <a href="/classic.html#data">Данные и обучение</a>
        <a href="/classic.html#scout">Разведка соперника</a>
        <a href="/classic.html#stats">Игроки и пул героев</a>
        <a href="/classic.html#config">Настройки</a>
        <hr>
        <a href="/classic.html">Классический интерфейс</a>
      </nav>
    </div>
  </header>

  <section class="ribbon-wrap" aria-label="Ход драфта">
    <div class="ribbon" id="ribbon"></div>
    <div class="history">
      <button type="button" class="ghost-btn" id="undo" title="Ctrl+Z">Отменить</button>
      <button type="button" class="ghost-btn" id="redo" title="Ctrl+Shift+Z">Вернуть</button>
    </div>
  </section>

  <main class="stage" id="stage">
    <aside class="team ours" id="team-ours"></aside>

    <section class="focus" id="focus">
      <h1 class="focus-title" id="focus-title"></h1>
      <p class="focus-sub" id="focus-sub"></p>
      <div class="cards" id="cards"></div>
      <div class="aside-rows" id="aside-rows"></div>
    </section>

    <aside class="team theirs" id="team-theirs"></aside>
  </main>

  <section class="picker" id="picker" aria-label="Выбор героя">
    <div class="picker-head">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Начните вводить имя героя" aria-label="Поиск героя">
      <div class="roles" id="role-filter" role="group" aria-label="Фильтр по роли"></div>
      <span class="picker-hint" id="picker-hint"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
