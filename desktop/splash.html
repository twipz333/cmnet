<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>cmnet</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f1115; color: #c9d1d9;
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d4a72c;
    display: inline-block; margin: 0 4px; animation: b 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  h1 { font-weight: 600; font-size: 20px; letter-spacing: .02em; margin: 18px 0 6px; }
  p { margin: 0; opacity: .6; }
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <h1>cmnet</h1>
    <p>Запускаю ядро…</p>
  </div>
</body>
</html>
